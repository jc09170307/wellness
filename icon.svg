<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="#0F6E56"/>
  
  <!-- Lotus petals — back row -->
  <ellipse cx="96" cy="72" rx="14" ry="28" fill="#5DCAA5" opacity=".7" transform="rotate(-30 96 96)"/>
  <ellipse cx="96" cy="72" rx="14" ry="28" fill="#5DCAA5" opacity=".7" transform="rotate(30 96 96)"/>
  <ellipse cx="96" cy="72" rx="14" ry="28" fill="#5DCAA5" opacity=".7" transform="rotate(-60 96 96)"/>
  <ellipse cx="96" cy="72" rx="14" ry="28" fill="#5DCAA5" opacity=".7" transform="rotate(60 96 96)"/>

  <!-- Lotus petals — front row -->
  <ellipse cx="96" cy="68" rx="13" ry="30" fill="#E1F5EE" opacity=".9" transform="rotate(-15 96 96)"/>
  <ellipse cx="96" cy="68" rx="13" ry="30" fill="#E1F5EE" opacity=".9" transform="rotate(15 96 96)"/>
  <ellipse cx="96" cy="68" rx="13" ry="30" fill="#E1F5EE" opacity=".9" transform="rotate(-45 96 96)"/>
  <ellipse cx="96" cy="68" rx="13" ry="30" fill="#E1F5EE" opacity=".9" transform="rotate(45 96 96)"/>
  <ellipse cx="96" cy="68" rx="13" ry="30" fill="#E1F5EE" opacity=".9"/>

  <!-- Center circle -->
  <circle cx="96" cy="96" r="16" fill="#0F6E56"/>
  <circle cx="96" cy="96" r="12" fill="#FFD700" opacity=".9"/>

  <!-- Acupuncture needle — vertical through center -->
  <line x1="96" y1="52" x2="96" y2="140" stroke="#0F6E56" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="96" cy="52" rx="4" ry="6" fill="#FFD700"/>

  <!-- Water lines at base -->
  <path d="M60,130 Q72,124 84,130 Q96,136 108,130 Q120,124 132,130" fill="none" stroke="#5DCAA5" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <path d="M66,140 Q78,134 90,140 Q102,146 114,140 Q126,134 126,140" fill="none" stroke="#5DCAA5" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
</svg>
