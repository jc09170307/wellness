<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="96" cy="96" r="96"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <circle cx="96" cy="96" r="96" fill="#0d1117"/>
  
  <!-- Five segments using paths, gap between each -->
  <!-- Wood - Green - Top (starts at -90, 72 degrees) -->
  <path d="M96,96 L96,4 A92,92 0 0,1 183.4,69.4 Z" fill="#0F6E56"/>
  <!-- Fire - Red - Top Right -->
  <path d="M96,96 L183.4,69.4 A92,92 0 0,1 152.8,175.6 Z" fill="#C0392B"/>
  <!-- Earth - Amber - Bottom -->
  <path d="M96,96 L152.8,175.6 A92,92 0 0,1 39.2,175.6 Z" fill="#BA7517"/>
  <!-- Metal - Silver - Bottom Left -->
  <path d="M96,96 L39.2,175.6 A92,92 0 0,1 8.6,69.4 Z" fill="#8E9AAB"/>
  <!-- Water - Blue - Top Left -->
  <path d="M96,96 L8.6,69.4 A92,92 0 0,1 96,4 Z" fill="#2471A3"/>
  
  <!-- White gap lines between segments -->
  <line x1="96" y1="96" x2="96" y2="4" stroke="#0d1117" stroke-width="3"/>
  <line x1="96" y1="96" x2="183.4" y2="69.4" stroke="#0d1117" stroke-width="3"/>
  <line x1="96" y1="96" x2="152.8" y2="175.6" stroke="#0d1117" stroke-width="3"/>
  <line x1="96" y1="96" x2="39.2" y2="175.6" stroke="#0d1117" stroke-width="3"/>
  <line x1="96" y1="96" x2="8.6" y2="69.4" stroke="#0d1117" stroke-width="3"/>
  
  <!-- Center circle -->
  <circle cx="96" cy="96" r="32" fill="#0d1117"/>
  <circle cx="96" cy="96" r="30" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
  
  <!-- Element emojis in each segment -->
  <!-- Wood - top center of green segment ~angle -54 from center, r=62 -->
  <text x="118" y="48" font-size="26" text-anchor="middle" dominant-baseline="middle">🌳</text>
  <!-- Fire - right -->
  <text x="158" y="118" font-size="26" text-anchor="middle" dominant-baseline="middle">🔥</text>
  <!-- Earth - bottom center -->
  <text x="96" y="168" font-size="26" text-anchor="middle" dominant-baseline="middle">🏔️</text>
  <!-- Metal - left bottom -->
  <text x="34" y="118" font-size="26" text-anchor="middle" dominant-baseline="middle">⚔️</text>
  <!-- Water - top left -->
  <text x="52" y="48" font-size="26" text-anchor="middle" dominant-baseline="middle">🌊</text>
  
  <!-- Center label -->
  <text x="96" y="92" font-size="9" fill="#1D9E75" text-anchor="middle" font-weight="600" font-family="system-ui">五</text>
  <text x="96" y="103" font-size="9" fill="#1D9E75" text-anchor="middle" font-weight="600" font-family="system-ui">行</text>
</svg>
